name: Restore open-source field guide
on:
  push:
    paths:
      - '.bootstrap/guide.tar.bz2.base64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project source files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/guide.tar.bz2.base64 > /tmp/guide.tar.bz2
          tar -xjf /tmp/guide.tar.bz2 --strip-components=1
          test -f README.md
          test -f data/species.json
          test -f src/build.py
          test -f .github/workflows/build.yml
          rm -rf .bootstrap
          rm .github/workflows/restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Red Sea field guide sources"
          git push
